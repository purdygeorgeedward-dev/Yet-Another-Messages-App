name: Phone debug APK

on:
  push:
    branches: [build/galaxy-a26-debug]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/checkout@v4
        with:
          repository: purdygeorgeedward-dev/Yet-Another-Commons
          ref: 90e41fc479ede78da1c6b07e4db271af5bd26bcf
          path: .build-commons
      - name: Use Commons source at the pinned revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("settings.gradle.kts")
          settings.write_text(settings.read_text().replace("https://www.jitpack.io", "https://jitpack.io") + '''
          includeBuild(".build-commons") {
              dependencySubstitution {
                  substitute(module("com.github.purdygeorgeedward-dev:Yet-Another-Commons")).using(project(":commons"))
              }
          }
          ''')
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: messages-gel-preview-debug-key-v1
      - name: Build debug APK
        run: bash ./gradlew :app:assembleFossDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: messages-gel-preview-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Render gel samples with native Android graphics
        timeout-minutes: 10
        run: |
          bash ./gradlew :app:testFossDebugUnitTest --tests org.fossify.messages.GelRenderTest --stacktrace
          cp app/build/gel-render-preview.png gel-render-preview.png
      - name: Export rendered sample for inspection
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          print("GEL_RENDER_PNG_BASE64=" + base64.b64encode(Path("gel-render-preview.png").read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gel-render-verification
          path: |
            gel-render-preview.png
            app/build/reports/tests/testFossDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
